openapi: 3.1.0
info:
  title: aaoracled
  version: 0.3.0
  summary: On-device App Attest oracle.
  description: |
    `aaoracled` runs **on the jailbroken device** and exposes a small REST API
    that drives Apple's App Attest (`DCAppAttestService` -> `com.apple.devicecheckd`)
    programmatically, outside any host app's UI/flow. It is the concrete
    demonstration that on a compromised application processor, App Attest becomes
    a callable signing service: the Secure Enclave still produces genuine,
    Apple-signed attestations/assertions, but *which App ID* they are bound to is
    driven by the caller (via a companion devicecheckd patch), not by a
    legitimately provisioned app.

    Threat model: the SEP is trusted; the entire AP (kernel, daemons, this
    process, IPC) is attacker-controlled. `aaoracled` is that attacker-controlled
    caller.

    `/keys` is backed entirely by Apple's own device-wide App Attest keychain
    namespace, not by anything `aaoracled` tracks itself: devicecheckd stores
    every App Attest private key on the device — from every app — under one
    shared keychain namespace with no per-app isolation visible to it, so a
    compromised devicecheckd can list, sign with, and delete any of them, not
    just ones `aaoracled` minted. This follows from the same AP-level
    compromise described above, not a separate finding — the notable part is
    that minting one *itself* works at all under a forged identity; that
    every key is then reachable this way is a structural consequence of
    where App Attest actually stores its keys.

    Scope: only ever exercised against Parker's own Apple Developer Team ID
    and App IDs Parker owns, plus the deliberate negative-control identities
    of the M3.5 matrix (a never-registered bundle; a random fake team).
    Attestations are inspected
    only by a relying-party harness Parker controls — never sent to a third party.

    ## `DCDevice` is deliberately not implemented

    `DeviceCheck.framework` exports two public classes, and this contract
    covers only one of them. `DCDevice`
    (`-generateTokenWithCompletionHandler:`, `API_AVAILABLE(ios(11.0))`) has
    **no endpoint here and is not planned**, even though a stub framework
    built against this API would have to answer it. The omission is a
    judgement about what this tool can meaningfully demonstrate, not an
    oversight.

    `DCDevice` is two bits of Apple-hosted per-device storage — the
    "has this device already used its free trial" primitive. It involves no
    Secure Enclave key, no attestation and no certificate. The token it
    produces is an opaque, single-use **bearer credential**: the app sends it
    to the relying party's server, that server combines it with an
    Apple-issued authentication key, and **Apple returns the bit values
    directly to the server**. The client never reads the bits, never sets
    them, and never asserts them.

    That is the opposite of the weakness this tool exists to demonstrate. App
    Attest hands the client a signed artifact whose App-ID binding is derived
    by application-processor userspace, and that derivation is forgeable here.
    DeviceCheck keeps the authoritative value at Apple and delivers it
    out-of-band to the server, so a fully compromised AP has almost no
    leverage: there is no client-side claim worth forging. A forged App ID
    would at most yield a token under another team's identity, which is inert
    without that team's Apple-issued key, and it would not change the device
    the token identifies.

    So an endpoint here would emit an opaque blob this project has no path to
    validate, and would demonstrate nothing. A stub that needs `DCDevice` can
    add it; this contract records why it is absent instead of implying the
    gap is unexamined.

servers:
  - url: http://127.0.0.1:8181
    description: |
      Device loopback (port 8181, distinct from the RP harness's 8080). Reached
      from the researcher's laptop via an SSH forward tunnel
      (`ssh -L 8181:127.0.0.1:8181 <device-alias>`) or consumed directly by an
      on-device demo page.

tags:
  - name: keys
    description: >-
      keyId-addressed. The public DCAppAttestService surface — one route per
      framework verb (generateKey, attestKey, generateAssertion). This is all
      a stub DeviceCheck.framework forwards. There is no listing here, because
      the framework has no enumeration verb.
  - name: labels
    description: >-
      Label-addressed. The privileged device-wide keychain surface, which
      exists only because devicecheckd is compromised and has no framework
      counterpart at all. Reaches every App Attest credential on the device,
      from every app.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness + environment probe.
      tags: [keys]
      responses:
        "200":
          description: aaoracled is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  supportedEnvironments:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
                    description: >-
                      Environments `POST /keys` can actually honor. Replaces
                      the former `defaultEnvironment` (0.1.0), which was a
                      hardcoded constant and became meaningless once the
                      environment was selectable per request - devicecheckd
                      chooses it per call, so there is no daemon-wide default.
                  environmentForgery:
                    type: boolean
                    description: >-
                      Whether the injected tweak can override devicecheckd's
                      environment decision. False means `environment` on
                      `POST /keys` is accepted but cannot be enforced.
                required: [ok]
      description: |
        Liveness and what this daemon can honor.

        `appAttestSupported` was removed in 0.3.0 and is **not** coming back.
        `DCAppAttestService.isSupported` answers for *this* process, which is
        a bare binary with no installed app bundle, so LaunchServices has no
        record for it and the answer is `NO` — while mint, attest and assert
        all work, because the forge supplies the identity devicecheckd
        actually evaluates. Reporting a `NO` alongside a working oracle read
        as "App Attest is unavailable here", which was simply false.

  /keys:
    post:
      operationId: createKey
      summary: Mint a new key for a given App ID (generateKey only).
      description: |
        Generates a fresh Secure Enclave key bound to the requested `appId` and
        `environment`, and returns its `keyId`. **This is `generateKey` and
        nothing else — it does not attest.** Attest separately via
        `POST /keys/{keyId}/attest`.

        > **Breaking change in 0.3.0.** This operation used to mint *and*
        > attest in one request, taking a `clientDataHash` and returning an
        > `attestation`. It no longer does either. `generateKey` and
        > `attestKey` are independently callable operations in Apple's
        > framework, and Apple's own flow separates them — a fused endpoint
        > cannot back a stub `DeviceCheck.framework`, which is this project's
        > end goal (see `AGENTS.md`).

        `appId` is a **caller-chosen** input: the whole point of the research
        is that devicecheckd derives identity in application-processor
        userspace, so a caller can name an App ID this process was never
        provisioned for.

        `environment` is burned into the credential's keychain label here, at
        mint time. That is why the attest operation does not accept it — it is
        read back off the label instead of being supplied twice.

        Nothing is stored. The key becomes addressable two ways, in two
        **different identifier namespaces**: by the `keyId` returned here
        (`POST /keys/{keyId}/attest`), and by its own opaque keychain label
        (`GET /labels`, `DELETE /labels/{label}`). They are not
        interchangeable, and as of 0.3.0 they live under separate path
        hierarchies so that confusing them fails loudly.

        No Apple network round trip happens here — key generation is local to
        the Secure Enclave. The CA round trip happens at attest time.
      tags: [keys]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKeyRequest" }
      responses:
        "201":
          description: Key minted. Not yet attested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateKeyResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: |
            devicecheckd refused to generate the key. The body reports the
            underlying DCError.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /keys/{keyId}/attest:
    post:
      operationId: attestKey
      summary: Attest a previously minted key.
      description: |
        Calls `attestKey:clientDataHash:completionHandler:` on a key minted by
        an **earlier** `POST /keys` request, and returns the resulting CBOR
        attestation object.

        Apple's framework takes exactly two inputs here — the `keyId` and the
        `clientDataHash` — and this operation adds exactly one more, `appId`,
        because the real framework derives the caller's identity from its
        audit token and this process cannot. Nothing else is required.

        **There is deliberately no `environment` field.** The environment was
        burned into this key's credential keychain label at `generateKey` time,
        so it is read back off the device. A mint/attest environment mismatch is
        therefore not expressible.

        `appId` **must** be the App ID the key was created under. Passing a
        different one is **UNDEFINED BEHAVIOUR**: the keychain label records
        `SHA256(appId)` at creation, so a mismatched attest leaves the key's
        recorded identity inconsistent with the identity in the issued
        certificate. Whether `attestKey` rejects the mismatch, honours the
        creation-time identity, or honours the attest-time identity is
        unverified and **not contracted**. Do not rely on any of the three.

        **Attesting the same key more than once is also UNDEFINED
        BEHAVIOUR — but it was observed to work.** `DCError.h` documents
        `DCErrorInvalidKey` for calling `attestKey` on "a key that's already
        been attested". That is not what this implementation measured: on the
        reference device (`iPad5,1` / build `19H422`, development
        environment, 2026-10-10) a second attest of an already-attested key
        returned **HTTP 200 with a second valid attestation**, carrying a
        distinct certificate serial and validity window but the same subject
        CN — i.e. Apple's CA issued a fresh certificate over the same key.

        Treat that as unspecified in both directions. Apple documents a
        failure; one observation on one device and OS build in one
        environment showed a success. It has not been checked in production,
        nor repeated enough to say whether it is rate-limited or bounded.
        Do not build on either outcome.

        > `{keyId}` here is the **keyId** from `POST /keys` — *not* the opaque
        > keychain label that the `/labels` hierarchy uses. The two live under
        > separate roots as of 0.3.0 precisely so they cannot be confused.

        This performs one Apple CA round trip and is rate-limit /
        `risk_metric` sensitive.
      tags: [keys]
      parameters:
        - name: keyId
          in: path
          required: true
          description: |
            The `keyId` returned by `POST /keys`, percent-encoded. It is
            standard base64, so `+`, `/` and `=` must all be escaped — `/` in
            particular must become `%2F`.
          schema: { type: string }
          example: "AyiKfDNaC%2B7s9b9MvDiGHxeWvMfbNPuEZVvuBp5Hd9E%3D"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttestRequest" }
      responses:
        "200":
          description: Attestation issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttestResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: |
            No credential on this device matches that `keyId`. The mapping is
            computed, not stored: the credential keychain label embeds
            `SHA256(utf8(keyId))`, so a `keyId` that matches no label does not
            exist here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            devicecheckd or Apple's attestation service rejected the request.
            The body reports the underlying DCError.

            `DCErrorServerUnavailable` means the CA was unreachable. Apple's
            guidance for that case is to retry later with the *same* key and
            the *same* `clientDataHash` to preserve the device's risk metric —
            which only this split endpoint makes expressible at all.

            `DCErrorInvalidKey` is what Apple documents for an
            already-attested key, but see the operation description: that is
            not the behaviour measured here, and re-attest is treated as
            undefined rather than as a reliable error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /keys/{keyId}/assert:
    post:
      operationId: assertKey
      summary: Produce a real App Attest assertion with an attested key.
      description: |
        Calls `generateAssertion:clientDataHash:completionHandler:` and returns
        the CBOR assertion object — `{signature, authenticatorData}` — that a
        relying party expects for every post-registration request.

        devicecheckd builds `authData` itself — the rpIdHash plus its own
        monotonically incrementing counter for the key — and the Secure
        Enclave signs over `authData || clientDataHash`. Verified on hardware
        2026-10-10: three successive calls on one key reported counter 1, 2,
        3, with a 37-byte `authData` carrying no AAGUID.

        This replaced the raw-label sign route removed in 0.3.0, which
        produced a bare ECDSA signature over arbitrary caller-supplied bytes
        with no identity and no counter. A stub `DeviceCheck.framework` could
        never have assembled an assertion out of that, because the counter is
        devicecheckd's state and nothing outside it knows the current value —
        inventing one desynchronises every other holder of the key and breaks
        a relying party's counter-increased check. (The underlying capability
        still exists in the tweak; only the HTTP route is gone.)

        The key must already be attested. Apple documents
        `DCErrorInvalidKey` for asserting with an unattested key.

        As with attest: `appId` is required only because this process has no
        identity for devicecheckd to derive, there is deliberately no
        `environment` field, and passing an `appId` other than the one the key
        was created under is **undefined behaviour**.

        The counter is not echoed in the response. It lives inside
        `authenticatorData`, which the caller must parse anyway, and
        devicecheckd owns the value — a second-hand copy would invite
        treating it as authoritative.
      tags: [keys]
      parameters:
        - name: keyId
          in: path
          required: true
          description: >-
            The `keyId` from `POST /keys`, percent-encoded (`/` must become
            `%2F`). Not the opaque keychain label — see the attest operation.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssertRequest" }
      responses:
        "200":
          description: Assertion produced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssertResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No credential on this device matches that `keyId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            devicecheckd refused. Most likely `DCErrorInvalidKey` — the key
            exists but has never been attested, which is the documented error
            for asserting with an unattested key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /labels:
    get:
      operationId: listLabels
      summary: List every App Attest credential resident on the device.
      description: |
        Calls Apple's own `_getAllCredentialKeychainLabels` (AppAttestInternal,
        resolved and called directly by address from inside the compromised
        devicecheckd process) and returns every label found under the shared
        `com.apple.appattest.identities` keychain service — one entry per
        credential ever created by App Attest on this device, by any app, real
        identity or forged, including ones this aaoracled instance itself
        minted (there is no separate bookkeeping for those).

        Labels are **opaque**: each is built from SHA256 hashes of the
        environment, per-installation app UUID, and team/bundle identifier
        (`_buildKeychainLabel`, one-way), plus `SHA256(utf8(keyId))` and a
        `p`/`d` environment character. The App ID is present only as its
        hash, so there is no way to recover which app a credential belongs to
        from a label alone — treat it as an opaque handle, not identifying
        information.
      tags: [labels]
      responses:
        "200":
          description: Every credential on the device.
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items: { $ref: "#/components/schemas/LabelEntry" }
                required: [labels]
        "502":
          description: The devicecheckd-side enumeration call failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /labels/{label}:
    delete:
      operationId: deleteLabel
      summary: Delete a credential from the device.
      description: |
        Calls Apple's own `_deleteCredentialKeychainWithLabel` (same
        address-resolution technique as `listLabels`), removing the keychain
        item for `label`.

        This call is **idempotent by Apple's own design, not aaoracled's**:
        confirmed live (a real device, a real credential) that the underlying
        function returns success both when the item existed and was actually
        removed, and when it was already gone — Apple's own
        `_delete_keychain_item` treats `SecItemDelete`'s real success and
        `errSecItemNotFound` as equally successful outcomes. There is
        therefore no reliable way to report "it didn't exist" as a distinct
        `404`, and aaoracled does not fake one on top of it.

        **A value that is not label-shaped is a `400`, not a success.** That
        idempotency used to swallow caller errors too: before 0.3.0, passing a
        `keyId` — or literal garbage — returned `200 {"deleted": true}` having
        removed nothing (verified 2026-10-10). Labels always begin `aa:`, so
        anything else is now rejected outright. Idempotency for a *real* label
        is unchanged and deliberate; "that was never a label" is a different
        condition and now says so.
      tags: [labels]
      parameters:
        - name: label
          in: path
          required: true
          description: |
            A label exactly as returned by `GET /labels`, percent-encoded.
            Labels contain `:` plus base64's `+`/`/`/`=` — encode the entire
            value; in particular any `/` MUST become `%2F` or it will be
            parsed as a path separator.

            This is **not** a `keyId`. A `keyId` from `POST /keys` is a
            different identifier and is rejected here with a `400`.
          schema: { $ref: "#/components/schemas/Label" }
      responses:
        "200":
          description: Delete call succeeded (see idempotency note above).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteLabelResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: The underlying delete call genuinely failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  responses:
    BadRequest:
      description: |
        Malformed request (bad base64, missing field, bad appId shape), or a
        field the endpoint does not accept.

        Request bodies are **closed**: every request schema is
        `additionalProperties: false`, and the daemon rejects unknown fields
        with `error: "unknown_field"` naming them. This is deliberate — 0.3.0
        removed `clientDataHash` from `POST /keys`, and an ignored-field
        response would hand a 0.2.0 client a 201 with a silently different
        shape instead of an error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Environment:
      type: string
      enum: [development, production]
      default: development
      description: |
        App Attest environment. Selects the AAGUID Apple stamps into authData
        (`appattestdevelop` vs `appattest`).

        Enforced by hooking AppAttestInternal's private
        `generateEnvironmentByAppSigning`, whose integer return (0
        development, 1 production) is the sole input to both the credential
        label's environment character and the AAGUID Apple stamps into
        authData. Confirmed on-device 2026-10-10 by overriding that return
        and watching the minted label flip.

        It is deliberately NOT done by presenting an `appattest-environment`
        entitlement: devicecheckd reads that key only on a fallback path
        taken when the caller has no LaunchServices bundle record, so an
        entitlement-based approach works for an unforged caller and silently
        stops working for a forged one. Earlier revisions echoed this field
        in the response without it affecting anything.

    AppId:
      type: string
      pattern: '^[A-Z0-9]{10}\.[A-Za-z0-9.\-]+$'
      description: App ID as `<TeamID>.<BundleID>`, e.g. `ABCDE12345.com.example.myapp`.
      examples: ["ABCDE12345.com.example.myapp"]

    Base64:
      type: string
      contentEncoding: base64
      description: Standard base64-encoded bytes.

    Label:
      type: string
      pattern: '^aa:'
      description: >-
        Opaque credential-keychain label from AppAttestInternal's own
        namespace, verbatim (including its `aa:` prefix) — see `GET /labels`.
        Always starts `aa:`, which is what lets a misdirected `keyId` be
        rejected rather than silently accepted.
      examples:
        - "aa:9Ur1MdQmPZZbOLudX+0T2lAbouGfiPZH1GQOIRyp88Y=d:4VI0nln7iw2mu3QIYzOuKkK9973ltBVMr6Rra6VrfSU=:eoYNTZIaNEumvCYOW4JCGkUhl7iv/6HpXUuvbGt+Tk0=:rk"

    LabelEntry:
      type: object
      description: |
        A resident credential plus the environment it was minted under.

        The environment is not looked up anywhere - it is encoded directly in
        the label as a single character right after the first base64
        component's `=` padding (`=d:` development, `=p:` production), so
        reading it costs nothing: no attestation, no network, no CA round
        trip. That makes `GET /labels` the cheapest way to confirm an
        `environment` override on `POST /keys` actually took effect, and it is
        how the attest and assert operations recover a key's environment
        instead of asking the caller for it.

        BREAKING in 0.3.0: this moved from `GET /keys` to `GET /labels`, and
        the per-entry field is now `label` rather than `key`. (In 0.1.0 the
        array held bare label strings.)
      properties:
        label: { $ref: "#/components/schemas/Label" }
        environment:
          oneOf:
            - $ref: "#/components/schemas/Environment"
            - type: "null"
          description: >-
            Null when the label does not match the known layout - reported as
            unknown rather than guessed.
      required: [label, environment]

    CreateKeyRequest:
      type: object
      additionalProperties: false
      properties:
        appId: { $ref: "#/components/schemas/AppId" }
        environment: { $ref: "#/components/schemas/Environment" }
      required: [appId]

    CreateKeyResponse:
      type: object
      properties:
        keyId:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          description: >-
            The credentialId App Attest assigned this key. Pass it back to
            `POST /keys/{keyId}/attest` and `/assert`. NOT the same string as
            the opaque label `GET /labels` returns for this same key — use
            that label to delete it. It is
            `base64(SHA256(uncompressed public key point))`, so it is derived
            from the key rather than assigned arbitrarily.
        appId: { $ref: "#/components/schemas/AppId" }
        environment: { $ref: "#/components/schemas/Environment" }
      required: [keyId, appId, environment]

    AttestRequest:
      type: object
      additionalProperties: false
      properties:
        appId:
          allOf: [{ $ref: "#/components/schemas/AppId" }]
          description: |
            The App ID to present to devicecheckd for this call. **Must be the
            same App ID the key was minted under** — passing a different one is
            undefined behaviour (see the operation description).

            Required only because this process has no legitimate identity for
            devicecheckd to derive. Apple's `attestKey` takes no such argument.
        clientDataHash:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          description: |
            The 32-byte SHA-256 hash the attestation is bound to (typically
            `SHA256(server_challenge)`). Passed straight to `attestKey`.

            Because the key already exists by the time this is called, a hash
            that depends on the `keyId` — e.g. `SHA256(utf8(keyId))`, which
            some relying parties use in place of a server challenge — can
            simply be computed by the caller from the `keyId` that
            `POST /keys` returned. The daemon does not need to derive it.
      required: [appId, clientDataHash]

    AttestResponse:
      type: object
      properties:
        keyId: { $ref: "#/components/schemas/Base64" }
        appId: { $ref: "#/components/schemas/AppId" }
        environment:
          allOf: [{ $ref: "#/components/schemas/Environment" }]
          description: >-
            Read back from the credential's keychain label, not supplied by the
            caller. This is the environment actually burned into the key at
            mint time, so it is ground truth rather than an echo.
        attestation:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          description: CBOR `apple-appattest` attestation object, base64-encoded.
        counter: { type: integer, const: 0 }
      required: [keyId, appId, environment, attestation, counter]

    AssertRequest:
      type: object
      additionalProperties: false
      properties:
        appId:
          allOf: [{ $ref: "#/components/schemas/AppId" }]
          description: >-
            Must be the App ID the key was created under; anything else is
            undefined behaviour. Required only because this process has no
            identity of its own for devicecheckd to derive.
        clientDataHash:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          description: >-
            Exactly 32 bytes — a SHA-256 digest, per
            `DCAppAttestService.h` ("A SHA256 hash of a unique, single-use
            data block"). devicecheckd composes the signed message around it
            rather than signing it directly.
      required: [appId, clientDataHash]

    AssertResponse:
      type: object
      properties:
        keyId: { $ref: "#/components/schemas/Base64" }
        appId: { $ref: "#/components/schemas/AppId" }
        environment:
          allOf: [{ $ref: "#/components/schemas/Environment" }]
          description: Read back from the credential's keychain label.
        assertion:
          allOf: [{ $ref: "#/components/schemas/Base64" }]
          description: >-
            CBOR assertion object — a map of `signature` and
            `authenticatorData`, base64-encoded. The counter is inside
            `authenticatorData`.
      required: [keyId, appId, environment, assertion]

    DeleteLabelResponse:
      type: object
      properties:
        label: { $ref: "#/components/schemas/Label" }
        deleted:
          type: boolean
          const: true
      required: [label, deleted]

    Error:
      type: object
      properties:
        error: { type: string, description: Short machine-readable code. }
        detail: { type: string, description: Human-readable detail (e.g. DCError). }
      required: [error]
